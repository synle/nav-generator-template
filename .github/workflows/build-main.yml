name: build-main

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # https://github.com/synle/workflows/blob/main/.github/workflows/build-and-commit-sh.yml
    uses: synle/workflows/.github/workflows/build-and-commit-sh.yml@main
    with:
      deploy-to-pages: false
    # pages/id-token must stay granted: the reusable workflow's job declares
    # them unconditionally, and callers cannot downgrade a nested job's request.
    permissions:
      contents: write
      pages: write
      id-token: write
